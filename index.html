<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    pre { background: #282c34; color: #abb2bf; padding: 20px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <h1>JSON Viewer</h1>
  <div id="jsonData">Loading JSON...</div>
  <script>
    fetch('data.json')
      .then(response => {
        if (!response.ok) throw new Error('Could not load JSON file.');
        return response.json();
      })
      .then(json => {
        document.getElementById('jsonData').innerHTML = '<pre>' + JSON.stringify(json, null, 2) + '</pre>';
      })
      .catch(e => {
        document.getElementById('jsonData').innerText = e;
      });
  </script>
</body>
</html>
